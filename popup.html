<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; width: 240px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, Arial, sans-serif;
    background: #FBF7F0; color: #1B2420;
  }
  @media (prefers-color-scheme: dark) { body { background: #12100E; color: #F2EDE3; } }
  .c { display: flex; align-items: center; gap: 11px; padding: 16px 18px; }
  .logo {
    width: 30px; height: 30px; border-radius: 10px; flex: 0 0 auto;
    background: linear-gradient(135deg, #1f9370, #0f6047); color: #fff;
    display: grid; place-items: center;
    box-shadow: 0 4px 12px -6px #0f6047;
  }
  .t { font-weight: 800; font-size: 13.5px; letter-spacing: -.01em; }
  .s { font-size: 11px; opacity: .6; }
</style>
</head>
<body>
  <div class="c">
    <div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V21h14V9.8"/><path d="M10 21v-6h4v6"/></svg></div>
    <div><div class="t">WohnungsBewerber</div><div class="s" id="s">wird geöffnet …</div></div>
  </div>
  <!-- Hier KEIN eingebettetes Skript: Manifest V3 erzwingt script-src 'self',
       eingebettete Skripte werden blockiert und landen als roter Fehler auf
       chrome://extensions. Die Sprachwahl für diese eine Zeile steht deshalb
       oben in popup.js. Geprüft von tests/i18n.test.js (50–53). -->
  <script src="popup.js"></script>
</body>
</html>
